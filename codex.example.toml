# Merge into your Codex configuration after installing the project.
# Replace /ABSOLUTE/PATH with the checkout path.
[mcp_servers.syx_advisor]
command = "/ABSOLUTE/PATH/.venv/bin/syx-mcp"
# Windows: command = "C:/ABSOLUTE/PATH/.venv/Scripts/syx-mcp.exe"

# Both game and server default to ~/.local/share/syx-assistant.
# If you override it, set the same value in the game's environment too:
# [mcp_servers.syx_advisor.env]
# SYX_STATE_DIR = "/ABSOLUTE/STATE/DIRECTORY"
