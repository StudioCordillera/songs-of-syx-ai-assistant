# Merge this entry into your Codex configuration after installing the project.
# Replace every /ABSOLUTE/PATH with your local checkout path.
[mcp_servers.syx_advisor]
command = "/ABSOLUTE/PATH/.venv/bin/syx-mcp"
# Windows: command = "C:/ABSOLUTE/PATH/.venv/Scripts/syx-mcp.exe"
[mcp_servers.syx_advisor.env]
SYX_STATE_DIR = "/ABSOLUTE/PATH/runtime"
