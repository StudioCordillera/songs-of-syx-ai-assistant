[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "songs-of-syx-ai-assistant"
version = "0.5.0"
description = "Read-only game-state and citation MCP foundation for Songs of Syx"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
syx-mcp = "syx_mcp:main"
syx-knowledge = "syx_knowledge:main"

[tool.setuptools]
py-modules = ["syx_mcp", "syx_knowledge", "syx_query", "syx_api_support", "syx_api_manifest"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
